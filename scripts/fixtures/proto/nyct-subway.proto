// NYCT subway extensions to GTFS-realtime, as described in the MTA's
// "GTFS-realtime Reference for the New York City Subway" (version 1.0).
//
// Re-typed for this project from the published reference; field numbers and names follow
// that document. Verify against the current copy on https://www.mta.info/developers before
// relying on anything beyond train_id / is_assigned / direction / tracks.
//
// TrackNYC's Java decoder does NOT need generated code for this file: it reads extension
// 1001 from the unknown-field set (see NyctExtensions.java). This file is used by the
// Python fixture generator and as documentation.

syntax = "proto2";

import "gtfs-realtime.proto";

option java_package = "com.google.transit.realtime";
package transit_realtime;

message TripReplacementPeriod {
  // The replacement period is for this route.
  optional string route_id = 1;
  // Trips in the feed with a start time inside this window replace scheduled trips.
  optional transit_realtime.TimeRange replacement_period = 2;
}

message NyctFeedHeader {
  required string nyct_subway_version = 1;
  repeated TripReplacementPeriod trip_replacement_period = 2;
}

extend transit_realtime.FeedHeader {
  optional NyctFeedHeader nyct_feed_header = 1001;
}

message NyctTripDescriptor {
  // Internal train identifier, e.g. "06 0123+ PEL/BBR".
  optional string train_id = 1;
  // True once a physical train has been assigned to the trip (i.e. it has left, or is about
  // to leave, its origin). Unassigned trips are scheduled predictions only.
  optional bool is_assigned = 2;

  enum Direction {
    NORTH = 1;
    EAST = 2;
    SOUTH = 3;
    WEST = 4;
  }
  optional Direction direction = 3;
}

extend transit_realtime.TripDescriptor {
  optional NyctTripDescriptor nyct_trip_descriptor = 1001;
}

message NyctStopTimeUpdate {
  optional string scheduled_track = 1;
  optional string actual_track = 2;
}

extend transit_realtime.TripUpdate.StopTimeUpdate {
  optional NyctStopTimeUpdate nyct_stop_time_update = 1001;
}
