name: CI

on:
  push:
    branches: [main, 'build/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  backend:
    name: Backend (unit + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - name: Check fixtures are reproducible
        run: |
          python3 -m pip install --quiet protobuf
          python3 scripts/fixtures/gen_static.py --check
      - name: Unit tests
        run: ./gradlew --no-daemon build
      # Docker is available on GitHub runners, so the Testcontainers tests run here even
      # though they are skipped in environments without a Docker daemon.
      - name: Integration tests (PostGIS + Redis via Testcontainers)
        run: ./gradlew --no-daemon integrationTest
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: '**/build/reports/tests/**'
          if-no-files-found: ignore

  frontend:
    name: Web (typecheck, unit, build, Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci || npm install
      - run: npm run typecheck
      - run: npm test -- --run
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Playwright smoke test (mocked API)
        run: npm run e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: web/playwright-report
          if-no-files-found: ignore

  e2e-stack:
    name: End-to-end against the replay stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: temurin
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Start the backend in replay mode (no database)
        run: |
          SPRING_PROFILES_ACTIVE=nodb ./gradlew --no-daemon :tracknyc-service:bootRun > backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && break
            sleep 5
          done
          curl -sf "http://localhost:8080/api/trains" | head -c 400
      - name: Playwright against the live replay backend
        working-directory: web
        run: |
          npm ci || npm install
          npx playwright install --with-deps chromium
          E2E_LIVE=1 npm run e2e -- --project=desktop
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: backend-log
          path: backend.log

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Trivy — filesystem (dependencies, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          format: sarif
          output: trivy-fs.sarif
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

  docker:
    name: Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build service image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.service
          push: false
          load: true
          tags: tracknyc/service:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/Dockerfile.web
          push: false
          load: true
          tags: tracknyc/web:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy — service image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: image
          image-ref: tracknyc/service:ci
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '0'
          format: table
      - name: Smoke-test the stack
        run: |
          cp .env.example .env
          docker compose -f infra/docker-compose.yml up -d --wait postgres redis
          docker compose -f infra/docker-compose.yml up -d service
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health/readiness && break
            sleep 5
          done
          test "$(curl -sf http://localhost:8080/api/trains | python3 -c 'import json,sys; print(json.load(sys.stdin)["count"] > 0)')" = "True"
          docker compose -f infra/docker-compose.yml down -v
